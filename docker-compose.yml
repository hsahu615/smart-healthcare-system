version: "3.8"

services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        networks:
            - app-network
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=rootpassword
        volumes:
            - mongo-data:/data/db

    gateway-service:
        build:
            context: ./gateway-service
        container_name: gateway-service
        networks:
            - app-network
        ports:
            - "8080:8080" # Only gateway-service is exposed externally
        environment:
            - GATEWAY_SERVICE_PORT=8080
            - JWT_SECRET=aHR0cHM6Ly93d3cueW91YmlsdW1hbWVyaWNhLmNvbS9sb2dpbi8= # Base64-encoded secret
        restart: always

    auth-service:
        build:
            context: ./auth-service
        container_name: auth-service
        networks:
            - app-network
        depends_on:
            - mongodb
#        ports:
#            - "8081:8080"
        environment:
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
            - JWT_SECRET=aHR0cHM6Ly93d3cueW91YmlsdW1hbWVyaWNhLmNvbS9sb2dpbi8= # Base64-encoded secret
        restart: always

    doctor-service:
        build:
            context:  ./doctor-service
        container_name: doctor-service
        networks:
            - app-network
        depends_on:
            - mongodb
            - gateway-service
#        ports:
#            - "8082:8080"
        environment:
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
        restart: always

    patient-service:
        build:
            context: ./patient-service
        container_name: patient-service
        networks:
            - app-network
        depends_on:
            - mongodb
            - gateway-service
#        ports:
#            - "8083:8080"
        environment:
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
        restart: always

    appointment-service:
        build:
            context: ./appointment-service
        container_name: appointment-service
        networks:
            - app-network
        depends_on:
            - mongodb
            - gateway-service
            - doctor-service
            - patient-service
            - # kafka
#        ports:
#            - "8084:8080"
        environment:
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
            - # kafka bootstrap server, topic name
        restart: always

    notification-service:
        build:
            context: ./notification-service
        container_name: notification-service
        networks:
            - app-network
        depends_on:
            - mongodb
            - gateway-service
            - doctor-service
            - patient-service
            - appointment-service
            - # kafka
              #        ports:
            #            - "8084:8080"
        environment:
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
            - # kafka bootstrap server, topic name
        restart: always

    ui-service:
        build:
            context: ./ui-component # Path to your ReactJS project
        container_name: ui-service
        networks:
            - app-network
        depends_on:
            - mongodb
        ports:
            - "9090:80" # Expose the React app on port 9090
        restart: always

networks:
    app-network:

volumes:
    mongo-data:
        driver: local


